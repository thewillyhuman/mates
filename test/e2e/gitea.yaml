# A throwaway Gitea for end-to-end tests (§15.1). SQLite, no persistence,
# registration disabled; the e2e script creates the user and repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  labels: { app: gitea }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22
          env:
            - { name: GITEA__security__INSTALL_LOCK, value: 'true' }
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__server__HTTP_PORT, value: '3000' }
            - { name: GITEA__server__ROOT_URL, value: http://gitea:3000/ }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: 'true' }
            - { name: GITEA__webhook__ALLOWED_HOST_LIST, value: '*' }
            - { name: GITEA__repository__DEFAULT_BRANCH, value: main }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
spec:
  selector: { app: gitea }
  ports:
    - { name: http, port: 3000, targetPort: http }
