{{- if not .Values.credentials.existingSecret }}
# Credential store managed by mates-api through the Kubernetes API (§10.2).
# Created empty at install and never touched again by Helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mates.fullname" . }}-credentials
  labels:
    {{- include "mates.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
type: Opaque
data: {}
{{- end }}
