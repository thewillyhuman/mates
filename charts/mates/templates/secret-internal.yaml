# Signing key for per-invocation JWTs and sessions (§10.2). Created once at
# install (pre-install hook) and left alone by upgrades so sessions survive.
# Rotate by deleting the Secret and restarting the API.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mates.fullname" . }}-internal
  labels:
    {{- include "mates.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
type: Opaque
data:
  internal_key: {{ randAlphaNum 48 | b64enc | quote }}
